<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Test Data Orchestrator — Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
    header { background: #1a1d2e; padding: 20px 40px; border-bottom: 1px solid #2d3748; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    header span { background: #38a169; color: #fff; font-size: 0.7rem; padding: 3px 10px; border-radius: 20px; }
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 12px; padding: 24px; text-align: center; }
    .stat-card .number { font-size: 2.5rem; font-weight: 800; color: #68d391; }
    .stat-card .label { font-size: 0.85rem; color: #718096; margin-top: 6px; }
    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .panel { background: #1a1d2e; border: 1px solid #2d3748; border-radius: 12px; padding: 28px; }
    .panel h2 { font-size: 1rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; }
    .badge-pg { background: #2b6cb0; color: #bee3f8; }
    .badge-mongo { background: #276749; color: #c6f6d5; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: #a0aec0; margin-bottom: 6px; }
    .form-group input { width: 100%; background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 0.9rem; outline: none; }
    .form-group input:focus { border-color: #68d391; }
    .btn-group { display: flex; gap: 10px; margin-top: 8px; }
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-green { background: #38a169; color: #fff; }
    .btn-red { background: #e53e3e; color: #fff; }
    .btn-blue { background: #3182ce; color: #fff; }
    .btn-full { width: 100%; margin-top: 10px; padding: 12px; }
    .log { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 14px; font-family: monospace; font-size: 0.8rem; height: 140px; overflow-y: auto; margin-top: 20px; }
    .log-entry { padding: 3px 0; border-bottom: 1px solid #1a1d2e; }
    .log-entry.success { color: #68d391; }
    .log-entry.error { color: #fc8181; }
    .log-entry.info { color: #63b3ed; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-green { background: #68d391; }
    .dot-red { background: #fc8181; }
  </style>
</head>
<body>
  <header>
    <div>🧪</div>
    <h1>Dynamic Test Data Orchestrator</h1>
    <span id="apiStatus">● ONLINE</span>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <div class="number" id="totalOps">0</div>
        <div class="label">Operations Run</div>
      </div>
      <div class="stat-card">
        <div class="number" id="totalSeeded">0</div>
        <div class="label">Records Seeded</div>
      </div>
      <div class="stat-card">
        <div class="number" id="totalResets">0</div>
        <div class="label">Resets Executed</div>
      </div>
    </div>

    <div class="panels">
      <!-- PostgreSQL -->
      <div class="panel">
        <h2>🐘 PostgreSQL <span class="badge badge-pg">Users</span></h2>
        <div class="form-group">
          <label>Number of users to seed</label>
          <input type="number" id="pgCount" value="10" min="1" max="100"/>
        </div>
        <div class="btn-group">
          <button class="btn btn-green" onclick="seedUsers()">▶ Seed Users</button>
          <button class="btn btn-red" onclick="cleanUsers()">🧹 Clean</button>
        </div>
      </div>

      <!-- MongoDB -->
      <div class="panel">
        <h2>🍃 MongoDB <span class="badge badge-mongo">Products</span></h2>
        <div class="form-group">
          <label>Number of products to seed</label>
          <input type="number" id="mongoCount" value="10" min="1" max="100"/>
        </div>
        <div class="btn-group">
          <button class="btn btn-green" onclick="seedProducts()">▶ Seed Products</button>
          <button class="btn btn-red" onclick="cleanProducts()">🧹 Clean</button>
        </div>
      </div>
    </div>

    <!-- Reset global -->
    <div class="panel" style="margin-top: 24px;">
      <h2>⚡ Global Reset</h2>
      <p style="font-size:0.85rem; color:#718096; margin-bottom:12px;">Cleans all databases instantly — use before running your full test suite</p>
      <button class="btn btn-blue btn-full" onclick="resetAll()">🔄 Reset All Databases</button>
    </div>

    <!-- Activity log -->
    <div class="panel" style="margin-top: 24px;">
      <h2>📋 Activity Log</h2>
      <div class="log" id="log">
        <div class="log-entry info">— Dashboard initialized —</div>
      </div>
    </div>
  </div>

  <script>
    const BASE = '';
    let ops = 0, seeded = 0, resets = 0;

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      el.innerHTML += `<div class="log-entry ${type}">[${time}] ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
      ops++;
      document.getElementById('totalOps').textContent = ops;
    }

    async function call(path, method = 'GET', body = null) {
      try {
        const res = await fetch(path, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : null
        });
        return await res.json();
      } catch (e) {
        log('❌ Connection error: ' + e.message, 'error');
        return null;
      }
    }

    async function seedUsers() {
      const count = parseInt(document.getElementById('pgCount').value);
      log(`Seeding ${count} users in PostgreSQL...`, 'info');
      const data = await call('/seed/users', 'POST', { count });
      if (data?.success) {
        seeded += count;
        document.getElementById('totalSeeded').textContent = seeded;
        log(`✅ ${count} users seeded in PostgreSQL`, 'success');
      } else {
        log('❌ Failed to seed users', 'error');
      }
    }

    async function cleanUsers() {
      log('Cleaning users table...', 'info');
      const data = await call('/seed/users', 'DELETE');
      if (data?.success) log('🧹 Users table cleaned', 'success');
      else log('❌ Failed to clean users', 'error');
    }

    async function seedProducts() {
      const count = parseInt(document.getElementById('mongoCount').value);
      log(`Seeding ${count} products in MongoDB...`, 'info');
      const data = await call('/seed/products', 'POST', { count });
      if (data?.success) {
        seeded += count;
        document.getElementById('totalSeeded').textContent = seeded;
        log(`✅ ${count} products seeded in MongoDB`, 'success');
      } else {
        log('❌ Failed to seed products', 'error');
      }
    }

    async function cleanProducts() {
      log('Cleaning products collection...', 'info');
      const data = await call('/seed/products', 'DELETE');
      if (data?.success) log('🧹 Products collection cleaned', 'success');
      else log('❌ Failed to clean products', 'error');
    }

    async function resetAll() {
      log('⚡ Resetting all databases...', 'info');
      const data = await call('/reset', 'POST');
      if (data?.success) {
        resets++;
        document.getElementById('totalResets').textContent = resets;
        log('✅ All databases reset successfully', 'success');
      } else {
        log('❌ Reset failed', 'error');
      }
    }

    // Check API health on load
    window.onload = async () => {
      const data = await call('/health');
      if (data?.status === 'ok') {
        log('✅ API is online and healthy', 'success');
      } else {
        document.getElementById('apiStatus').textContent = '● OFFLINE';
        document.getElementById('apiStatus').style.background = '#e53e3e';
        log('❌ API is not responding', 'error');
      }
    };
  </script>
</body>
</html>
