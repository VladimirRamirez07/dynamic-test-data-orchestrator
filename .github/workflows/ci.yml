name: CI - Dynamic Test Data Orchestrator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create .env
        run: |
          echo "PG_HOST=localhost" >> .env
          echo "PG_PORT=5432" >> .env
          echo "PG_USER=testuser" >> .env
          echo "PG_PASSWORD=testpass" >> .env
          echo "PG_DATABASE=testdb" >> .env
          echo "MONGO_URI=mongodb://localhost:27017/testdb" >> .env
          echo "API_PORT=3000" >> .env

      - name: Run tests
        run: npm test